name: QuantEdge Scraper & Refresh

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run QuantEdge Quantitative Engine
        run: |
          python scraper.py

      - name: Commit and push fresh JSON dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "QuantEdge automated dataset refresh: fixtures.json"
          file_pattern: "fixtures.json"
